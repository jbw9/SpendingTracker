<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bgGradient)"/>
  
  <!-- Dollar Sign Symbol -->
  <g transform="translate(256, 256)">
    <path d="M 0 -120 L 0 -160" stroke="white" stroke-width="20" stroke-linecap="round"/>
    <path d="M 0 120 L 0 160" stroke="white" stroke-width="20" stroke-linecap="round"/>
    <path d="M -60 -80 C -60 -120, -30 -140, 0 -140 C 30 -140, 60 -120, 60 -80 C 60 -40, 30 -20, 0 -20 C -30 -20, -60 0, -60 40 C -60 80, -30 100, 0 100 C 30 100, 60 80, 60 40" 
          stroke="white" stroke-width="24" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Chart bars at bottom -->
  <g transform="translate(256, 380)">
    <rect x="-100" y="-40" width="40" height="40" fill="white" opacity="0.9" rx="4"/>
    <rect x="-40" y="-60" width="40" height="60" fill="white" opacity="0.9" rx="4"/>
    <rect x="20" y="-30" width="40" height="30" fill="white" opacity="0.9" rx="4"/>
    <rect x="80" y="-50" width="40" height="50" fill="white" opacity="0.9" rx="4"/>
  </g>
</svg>